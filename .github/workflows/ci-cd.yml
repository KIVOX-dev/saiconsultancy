name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# One run per branch/PR; newer pushes cancel older runs (never cancel a production deploy mid-flight).
concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  pull-requests: write

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  # ------------------------------------------------------------------ CI
  verify:
    name: Verify & build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install (clean, lockfile-exact)
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true   # report, don't block; remove once the tree is clean

      - name: Syntax-check serverless functions and server
        run: |
          for f in api/*.js server/*.js; do
            [ -f "$f" ] && node --check "$f"
          done

      - name: Build
        run: npm run build

      - name: Check build output
        run: |
          test -f dist/index.html
          ls dist/assets/*.js >/dev/null
          du -sh dist

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  # ------------------------------------------------------------------ CD: preview (PRs)
  preview:
    name: Deploy preview
    needs: verify
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: preview
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Pull Vercel settings
        run: npx --yes vercel@latest pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: npx --yes vercel@latest build --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        id: deploy
        run: |
          url=$(npx --yes vercel@latest deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL on the PR
        uses: actions/github-script@v7
        with:
          script: |
            const body = `Preview deployed: ${{ steps.deploy.outputs.url }}`;
            const { data: comments } = await github.rest.issues.listComments({ ...context.repo, issue_number: context.issue.number });
            const prev = comments.find(c => c.user.type === 'Bot' && c.body.startsWith('Preview deployed:'));
            if (prev) await github.rest.issues.updateComment({ ...context.repo, comment_id: prev.id, body });
            else await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body });

  # ------------------------------------------------------------------ CD: production (main)
  production:
    name: Deploy production
    needs: verify
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://saiconsultancy.in
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Pull Vercel settings
        run: npx --yes vercel@latest pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        run: npx --yes vercel@latest build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        id: deploy
        run: |
          url=$(npx --yes vercel@latest deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke test
        run: |
          set -e
          base="${{ steps.deploy.outputs.url }}"
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$base/") && [ "$code" = 200 ] && break
            sleep 6
          done
          [ "$code" = 200 ] || { echo "Home returned $code"; exit 1; }
          # SPA route must serve the app shell
          curl -fsS "$base/training-placement" | grep -q '<div id="root"' 
          # A missing asset must 404, never fall back to index.html
          code=$(curl -s -o /dev/null -w '%{http_code}' "$base/assets/does-not-exist.css")
          [ "$code" = 404 ] || { echo "Missing asset returned $code"; exit 1; }
          echo "Smoke test passed"
